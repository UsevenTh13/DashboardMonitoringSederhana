services:
  # ──────────────────────────────────────────
  # Laravel Application
  # ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: los_monitoring_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Monitoring LOS RS Arifin Achmad"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: los_monitoring_rs
      DB_USERNAME: los_user
      DB_PASSWORD: los_password_secret

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: error
    depends_on:
      db:
        condition: service_healthy
    networks:
      - los_network

  # ──────────────────────────────────────────
  # MySQL Database
  # ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: los_monitoring_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secret
      MYSQL_DATABASE: los_monitoring_rs
      MYSQL_USER: los_user
      MYSQL_PASSWORD: los_password_secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - los_network

  # ──────────────────────────────────────────
  # phpMyAdmin (Opsional – untuk kelola DB via browser)
  # ──────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: los_monitoring_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: los_user
      PMA_PASSWORD: los_password_secret
    depends_on:
      - db
    networks:
      - los_network

volumes:
  db_data:
    driver: local

networks:
  los_network:
    driver: bridge
